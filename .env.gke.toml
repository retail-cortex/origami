# ==============================================================================
# GKE Environment Configuration (.env.gke.toml)
# Defines runtime settings for the Origami router deployed against GKE vLLM server.
# ==============================================================================
[application]
name = "origami-router-gke"
projectId = "cs-poc-gvosjaln9q6gcudiayjqdzq"
location = "us-central1"
threadPoolSize = 20
enable_ops_sec = true
rules_routing = "rules_router.toml"
rules_ops_sec = "rules_ops_sec.toml"

[telemetry]
service_name = "origami-router-gke"
use_gcp = true

[ai_models.router]
model_name = "google/gemma-4-12B-it-qat-q4_0-unquantized"
temperature = 1.0
top_p = 0.5
top_k = 40
output_format = "application/json"
max_tokens = 32000
api_key = ""
instructions = """
## Persona
You're a purpose build router for choosing which agent to execute.
## Base Rules
Always route to the most specific agent available.
Safety first: Defer all sensitive/reputation questions to Fallback.
Do not invent agents.
Ordinal references (e.g. 'the first one', 'the one on the right') are POSITION_INDICATORS for items in the current carousel.
Hate speech, lawsuits, and inappropriate topics take ABSOLUTE PRIORITY and must go to Fallback.
Personal situations (grief/loss) are NOT inappropriate unless violence is expressed.
"""

[server]
host = "0.0.0.0"
port = 8000

# ------------------------------------------------------------------------------
# Router Engine Registration: GKE vLLM Remote Router
# ------------------------------------------------------------------------------
[[server.routers]]
name = "gke_vllm"
provider = "vllm"
model_name = "google/gemma-4-12B-it-qat-q4_0-unquantized"
# Target external IP address or endpoint URL of the GKE vLLM service
endpoint_url = "http://localhost:8000/v1"
